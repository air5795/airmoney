<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AirMoney — Login Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: Manrope, system-ui, sans-serif; }
  * { box-sizing: border-box; }

  /* Splash + UI animations */
  @keyframes amFade   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes amRise   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes amSpring { 0% { opacity: 0; transform: scale(.6); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes amDot      { 0%, 80%, 100% { opacity: .2; } 40% { opacity: .9; } }
  @keyframes amFloat    { 0%, 100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-8px, 12px) rotate(8deg); } }
  @keyframes amProgress { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @keyframes amPulse    { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.85); } }
  @keyframes amSheetUp  { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

  /* button hover */
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.98); }

  #root { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="airmoney-setup-data.jsx"></script>
<script type="text/babel" src="airmoney-home-data.jsx"></script>
<script type="text/babel" src="airmoney-app.jsx"></script>
<script type="text/babel" src="airmoney-setup.jsx"></script>
<script type="text/babel" src="airmoney-home.jsx"></script>
<script type="text/babel" src="airmoney-actions.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "paletteId": "mint"
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [resetKey, setResetKey] = React.useState(0);

    const palette = PALETTES.find(p => p.id === t.paletteId) || PALETTES[0];

    return (
      <>
        <DesignCanvas>
          <DCSection
            id="airmoney"
            title="AirMoney · Login + Setup + Home (Liquid Glass)"
            subtitle="Splash → Login → Configuración → Home con tarjetas, dock y FAB · iOS"
          >
            <DCArtboard id="vb" label="Variante B · Liquid Glass" width={402} height={874}>
              <AirMoneyApp variant="B" palette={palette} resetKey={resetKey} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel title="Tweaks">
          <TweakSection label="Marca">
            <TweakColor
              label="Paleta"
              value={[palette.ink, palette.accent, palette.soft]}
              options={PALETTES.map(p => [p.ink, p.accent, p.soft])}
              onChange={(arr) => {
                const found = PALETTES.find(p => p.ink.toLowerCase() === String(arr[0]).toLowerCase());
                if (found) setTweak('paletteId', found.id);
              }}
            />
            <TweakSelect
              label="Nombre"
              value={t.paletteId}
              options={PALETTES.map(p => ({ value: p.id, label: p.name }))}
              onChange={(v) => setTweak('paletteId', v)}
            />
          </TweakSection>
          <TweakSection label="Prototipo">
            <TweakButton
              label="Reiniciar flujo (volver al splash)"
              onClick={() => setResetKey(k => k + 1)}
            />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
