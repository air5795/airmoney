name: app_gastos
description: "App de control de gastos personales."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  http: ^1.5.0
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.0
  speech_to_text: ^7.4.0
  google_fonts: ^8.1.0
  local_auth: ^3.0.1
  crypto: ^3.0.7
  google_generative_ai: ^0.4.1
  flutter_local_notifications: ^22.0.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  file_picker: ^8.1.6
  pdf: ^3.12.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/fonts/
